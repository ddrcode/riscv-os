# Example pico2.cfg for Raspberry Pi Pico 2 (RISC-V core)
# Adjust settings below to match your debug adapter and board specifications

interface cmsis-dap
transport select swd

set CHIPNAME pico2_riscv

target create $CHIPNAME riscv -chain-position 0

reset_config srst_only

# Configure memory mapping (verify these addresses with official Pico 2 docs)
riscv configure -set memmap FLASH 0x20000000 0x40000
riscv configure -set memmap RAM   0x80000000 0x10000

init
reset init

