# Pinned nightly: build-std and the riscv32em target need nightly, and unpinned
# nightlies break regularly. To upgrade, bump the date and rebuild.
# rustfmt is used by bindgen to format the generated bindings.rs
[toolchain]
channel = "nightly-2026-02-17"
components = ["rust-src", "rustfmt"]
profile = "minimal"
